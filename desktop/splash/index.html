<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI Clipper</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
html,body{height:100%;margin:0;background:#0d0d10;color:#a3a3ad;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
body{display:grid;place-items:center}
.m{width:44px;height:44px;border-radius:12px;background:#8b5cf6;margin:0 auto 14px}
.s{width:18px;height:18px;border-radius:50%;border:2px solid #333;border-top-color:#a78bfa;margin:16px auto 0;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div style="text-align:center"><div class="m"></div><div style="color:#f4f4f6;font-weight:600">AI Clipper</div><div>Starting background service…</div><div class="s"></div></div></body></html>
