<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vyral</title>
<style>
html,body{height:100%;margin:0;background:#0d0d10;color:#a3a3ad;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
.c{text-align:center;max-width:560px;padding:24px}
.logo{width:88px;height:88px;margin:0 auto 14px;display:block}
h1{color:#f4f4f6;font-size:20px;margin:0 0 6px}
.s{width:18px;height:18px;border-radius:50%;border:2px solid #333;border-top-color:#a78bfa;margin:16px auto 0;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#ff8a8d;text-align:left;margin-top:14px}
pre{white-space:pre-wrap;word-break:break-word;background:#18181c;border-radius:10px;padding:12px;font:12px ui-monospace,Menlo,Consolas,monospace;color:#c8c8d0;max-height:240px;overflow:auto;text-align:left}
.hint{font-size:12px;color:#6f6f7a}
</style></head>
<body><div class="c" id="root">
  <img class="logo" src="vyral-logo.png" alt="">
  <h1>Vyral</h1>
  <div id="msg">Starting the background service…</div>
  <div class="hint" id="t"></div>
  <div class="s" id="spin"></div>
</div>
<script>
var start = Date.now();
setInterval(function () {
  var s = Math.round((Date.now() - start) / 1000);
  var t = document.getElementById("t");
  if (t && s >= 4) t.textContent = s + " s" + (s > 15 ? " · the first launch after installing can take up to a minute" : "");
}, 1000);
// Called by the app if the service can't start, with the reason and recent log lines.
window.vyralFailed = function (title, details, logPath) {
  document.getElementById("spin").remove();
  document.getElementById("t").textContent = "";
  document.getElementById("msg").innerHTML = "";
  var e = document.createElement("div"); e.className = "err"; e.textContent = title;
  var p = document.createElement("pre"); p.textContent = details || "(no output)";
  var h = document.createElement("div"); h.className = "hint";
  h.textContent = "Quit Vyral from the menu bar / tray icon and open it again. If it keeps happening, send this screen and the log file: " + logPath;
  document.getElementById("msg").append(e, p, h);
};
</script>
</body></html>
