name: Build Vyral installers

# Builds the Mac (.dmg) and Windows (setup .exe) apps and puts them on the repo's Releases page.
on:
  push:
    branches: [claude/laughing-darwin-p2x8x6]
    paths: ["backend/**", "frontend/**", "desktop/**", "scripts/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
            bundles: dmg
          - os: windows-latest
            label: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Build the interface
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build the background service (bundles FFmpeg + yt-dlp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./backend pyinstaller
          python scripts/build_backend.py

      - name: Smoke test the background service
        run: |
          BIN=$(ls desktop/src-tauri/service/clippr-backend*)
          "$BIN" --port 8777 --data-dir "$RUNNER_TEMP/vyral-smoke" --frontend frontend/dist > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8777/api/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/health.json" || (cat "$RUNNER_TEMP/smoke.log"; exit 1)
          grep -q '"ffmpeg":true' "$RUNNER_TEMP/health.json"
          curl -sf http://127.0.0.1:8777/ | grep -q clippr-token

      - name: Make a real speech sample (macOS voice)
        if: runner.os == 'macOS'
        run: say -o "$RUNNER_TEMP/speech.aiff" "This is a test of the Vyral captions. No way he actually did that."

      - name: Make a real speech sample (Windows voice)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $s.Speak("This is a test of the Vyral captions. No way he actually did that.")
          $s.Dispose()

      - name: Self-test captions inside the packaged service (real speech model + burned-in text)
        run: |
          BIN=$(ls desktop/src-tauri/service/clippr-backend*)
          SAMPLE=$(ls "$RUNNER_TEMP"/speech.* | head -1)
          "$BIN" --self-test "$SAMPLE" --data-dir "$RUNNER_TEMP/selftest" | tee "$RUNNER_TEMP/selftest.json"
          grep -qi '"render": \[1080, 1920\]' "$RUNNER_TEMP/selftest.json"
          grep -qiE 'test|captions|actually' "$RUNNER_TEMP/selftest.json"

      - name: Build the app
        working-directory: desktop
        run: npm ci && npx tauri build --bundles ${{ matrix.bundles }}

      - name: Install and launch the real app, wait until its window shows the interface
        timeout-minutes: 6
        run: |
          if [ "${{ matrix.label }}" = "mac" ]; then
            APP=$(ls -d desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
            "$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | grep -v clippr | head -1)" > "$RUNNER_TEMP/app.log" 2>&1 &
          else
            SETUP=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
            "$SETUP" /S
            sleep 5
            EXE=$(find "$LOCALAPPDATA" -maxdepth 3 -iname "vyral.exe" | head -1)
            echo "installed: $EXE"
            "$EXE" > "$RUNNER_TEMP/app.log" 2>&1 &
          fi
          for i in $(seq 1 120); do
            H=$(curl -s -m 3 http://127.0.0.1:8765/api/health || true)
            echo "$H" | grep -q '"ui_served":true' && { echo "App window loaded the interface after ~$((i*2)) s: $H"; exit 0; }
            sleep 2
          done
          echo "The installed app never showed the interface. Last health: $H"
          cat "$RUNNER_TEMP/app.log" || true
          find "$HOME" "$APPDATA" "$LOCALAPPDATA" -name service-output.log 2>/dev/null | head -3 | xargs -I{} sh -c 'echo "== {}"; tail -40 "{}"'
          exit 1

      - name: Collect installer
        run: |
          mkdir -p out
          if [ "${{ matrix.label }}" = "mac" ]; then
            cp desktop/src-tauri/target/release/bundle/dmg/*.dmg "out/Vyral-Mac-AppleSilicon.dmg"
          else
            cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/Vyral-Windows-Setup.exe"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: "vyral-${{ matrix.label }}", path: out/*, if-no-files-found: error }

      - name: Run the test suite on this OS
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          cat > notes.md <<NOTES
          **Download the file for your computer below, under Assets.**

          - **Mac (Apple Silicon: M1/M2/M3/M4):** Vyral-Mac-AppleSilicon.dmg. Open it and drag Vyral into Applications. The first time, macOS will say it can't verify the developer: open **System Settings > Privacy & Security**, scroll down, click **Open Anyway**.
          - **Windows 10/11:** Vyral-Windows-Setup.exe. Run it. If Windows shows "Windows protected your PC", click **More info > Run anyway**.

          Those warnings appear because the app isn't signed with a paid Apple / Microsoft certificate yet.

          Built from ${GITHUB_SHA::7}, version ${VERSION}.
          NOTES
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* --title "Vyral ${VERSION} (latest build)" --notes-file notes.md --target "$GITHUB_SHA" --latest
