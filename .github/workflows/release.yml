name: Build Vyral installers

# Builds the Mac (.dmg) and Windows (setup .exe) apps and puts them on the repo's Releases page.
on:
  push:
    branches: [claude/laughing-darwin-p2x8x6]
    paths: ["backend/**", "frontend/**", "desktop/**", "scripts/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
            bundles: app,dmg
          - os: windows-latest
            label: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Give this build its own version number
        run: |
          VERSION="0.4.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          for p in ["desktop/src-tauri/tauri.conf.json", "desktop/package.json"]:
              c = json.load(open(p)); c["version"] = v; json.dump(c, open(p, "w"), indent=2)
          p = "desktop/src-tauri/Cargo.toml"; s = open(p).read()
          open(p, "w").write(re.sub(r'(?m)^version = ".*?"', f'version = "{v}"', s, count=1))
          open("backend/clippr/__init__.py", "w").write(f'__version__ = "{v}"\n')
          PY
          echo "Building Vyral $VERSION"

      - name: Build the interface
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build the background service (bundles FFmpeg + yt-dlp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./backend pyinstaller
          python scripts/build_backend.py

      - name: Smoke test the background service
        run: |
          BIN=$(ls desktop/src-tauri/service/clippr-backend*)
          "$BIN" --port 8777 --data-dir "$RUNNER_TEMP/vyral-smoke" --frontend frontend/dist > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8777/api/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/health.json" || (cat "$RUNNER_TEMP/smoke.log"; exit 1)
          grep -q '"ffmpeg":true' "$RUNNER_TEMP/health.json"
          curl -sf http://127.0.0.1:8777/ | grep -q clippr-token

      - name: Make a real speech sample (macOS voice)
        if: runner.os == 'macOS'
        run: |
          # The runner's voice occasionally produces an empty file; retry until there's real audio.
          for i in 1 2 3; do
            say -v Samantha -o "$RUNNER_TEMP/speech.aiff" "This is a test of the Vyral captions. No way he actually did that." || say -o "$RUNNER_TEMP/speech.aiff" "This is a test of the Vyral captions. No way he actually did that."
            [ "$(wc -c < "$RUNNER_TEMP/speech.aiff")" -gt 50000 ] && break
            sleep 2
          done
          ls -la "$RUNNER_TEMP/speech.aiff"

      - name: Make a real speech sample (Windows voice)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $s.Speak("This is a test of the Vyral captions. No way he actually did that.")
          $s.Dispose()

      - name: Self-test captions inside the packaged service (real speech model + burned-in text)
        run: |
          BIN=$(ls desktop/src-tauri/service/clippr-backend*)
          SAMPLE=$(ls "$RUNNER_TEMP"/speech.* | head -1)
          "$BIN" --self-test "$SAMPLE" --data-dir "$RUNNER_TEMP/selftest" | tee "$RUNNER_TEMP/selftest.json"
          grep -qi '"render": \[1080, 1920\]' "$RUNNER_TEMP/selftest.json"
          grep -qiE 'test|captions|actually' "$RUNNER_TEMP/selftest.json"

      - name: Build the app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          BUNDLES="${{ matrix.bundles }}"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No update-signing key yet: building without auto-update files."
            npx tauri build --bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --bundles "$BUNDLES"
          fi

      - name: Install the app like a person would (Mac)
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | awk -F'\t' '{print $NF}')
          echo "Disk image contents (should be Vyral.app + an Applications shortcut to drag onto):"
          ls -la "$MNT"
          test -L "$MNT/Applications"
          cp -R "$MNT/Vyral.app" /Applications/
          hdiutil detach "$MNT"
          echo "APP_EXE=/Applications/Vyral.app/Contents/MacOS/$(ls /Applications/Vyral.app/Contents/MacOS | head -1)" >> "$GITHUB_ENV"

      - name: Install the app like a person would (Windows, silent installer)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "Installer size: {0:N0} MB" -f ($setup.Length / 1MB)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          while (-not $p.HasExited) {
            Start-Sleep 20
            $dir = Join-Path $env:LOCALAPPDATA 'Vyral'
            $mb = if (Test-Path $dir) { [math]::Round(((Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB) } else { 0 }
            "Still installing after $([int]$sw.Elapsed.TotalSeconds) s, $mb MB written"
          }
          "Installer finished in $([int]$sw.Elapsed.TotalSeconds) s with exit code $($p.ExitCode)"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'vyral.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed Vyral.exe not found" }
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch the installed app and wait until its window shows the interface
        timeout-minutes: 6
        run: |
          "$APP_EXE" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 120); do
            H=$(curl -s -m 3 http://127.0.0.1:8765/api/health || true)
            echo "$H" | grep -q '"ui_served":true' && { echo "App window loaded the interface after ~$((i*2)) s: $H"; exit 0; }
            sleep 2
          done
          echo "The installed app never showed the interface. Last health: $H"
          cat "$RUNNER_TEMP/app.log" || true
          find "$HOME" "$APPDATA" "$LOCALAPPDATA" -name service-output.log 2>/dev/null | head -3 | xargs -I{} sh -c 'echo "== {}"; tail -40 "{}"'
          exit 1

      - name: Collect installer
        run: |
          mkdir -p out
          if [ "${{ matrix.label }}" = "mac" ]; then
            cp desktop/src-tauri/target/release/bundle/dmg/*.dmg "out/Vyral-Mac-AppleSilicon.dmg"
            for f in desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig; do
              [ -f "$f" ] && cp "$f" "out/$(basename "$f" | sed 's/.*\.app\.tar\.gz/Vyral-Mac-AppleSilicon.app.tar.gz/')"
            done
          else
            cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/Vyral-Windows-Setup.exe"
            SIG=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -1 || true)
            [ -n "$SIG" ] && cp "$SIG" "out/Vyral-Windows-Setup.exe.sig"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: "vyral-${{ matrix.label }}", path: out/*, if-no-files-found: error }

      - name: Run the test suite on this OS
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  release:
    needs: build
    if: ${{ !cancelled() }}  # publish whichever installers passed every check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ls dist/* >/dev/null 2>&1 || { echo "No installer passed its checks; nothing to publish."; exit 1; }
          VERSION="0.4.${{ github.run_number }}"
          {
            echo "**Download the file for your computer below, under Assets.**"
            echo
            if [ -f dist/Vyral-Mac-AppleSilicon.dmg ]; then
              echo "- **Mac (Apple Silicon: M1 to M4):** Vyral-Mac-AppleSilicon.dmg. Open it and drag Vyral onto the Applications folder. The first time, macOS says it can't verify the developer: open **System Settings > Privacy & Security**, scroll down, click **Open Anyway**."
            fi
            if [ -f dist/Vyral-Windows-Setup.exe ]; then
              echo "- **Windows 10/11:** Vyral-Windows-Setup.exe. Run it. If Windows shows \"Windows protected your PC\", click **More info > Run anyway**."
            fi
            echo
            echo "Those warnings appear because the app isn't signed with a paid Apple / Microsoft certificate yet."
            echo
            echo "Built from ${GITHUB_SHA::7}, version ${VERSION}. Every installer here was installed and launched on a real Mac / Windows machine before publishing."
          } > notes.md
          if [ -n "$RELEASES_TOKEN" ]; then
            # Public downloads repo: versioned release + latest.json for the in-app updater.
            REPO="Drewzyy/vyral-releases"
            BASE="https://github.com/$REPO/releases/download/v$VERSION"
            python3 - "$VERSION" "$BASE" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          v, base = sys.argv[1], sys.argv[2]
          plats = {}
          if os.path.exists("dist/Vyral-Mac-AppleSilicon.app.tar.gz.sig"):
              plats["darwin-aarch64"] = {"signature": open("dist/Vyral-Mac-AppleSilicon.app.tar.gz.sig").read().strip(),
                                         "url": f"{base}/Vyral-Mac-AppleSilicon.app.tar.gz"}
          if os.path.exists("dist/Vyral-Windows-Setup.exe.sig"):
              plats["windows-x86_64"] = {"signature": open("dist/Vyral-Windows-Setup.exe.sig").read().strip(),
                                         "url": f"{base}/Vyral-Windows-Setup.exe"}
          json.dump({"version": v, "notes": f"Vyral {v}", "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "platforms": plats}, open("dist/latest.json", "w"), indent=2)
          print("update platforms:", list(plats))
          PY
            # A brand-new empty repo can't hold releases until it has one commit; add a README if needed.
            if ! GH_TOKEN="$RELEASES_TOKEN" gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
              printf '# Vyral downloads\n\nDownload the latest Vyral for Mac or Windows from [Releases](https://github.com/%s/releases/latest).\n' "$REPO" > readme.md
              GH_TOKEN="$RELEASES_TOKEN" gh api -X PUT "repos/$REPO/contents/README.md" -f message="Add README" -f content="$(base64 -w0 readme.md)" >/dev/null
              echo "Initialized $REPO with a README"
            fi
            GH_TOKEN="$RELEASES_TOKEN" gh release create "v$VERSION" dist/* --repo "$REPO" --title "Vyral $VERSION" --notes-file notes.md --latest
            echo "Published to https://github.com/$REPO/releases/latest"
          else
            echo "No RELEASES_TOKEN secret yet: publishing to this private repo only (no auto-updates)."
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/* --title "Vyral ${VERSION} (latest build)" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
