name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Backend tests
        working-directory: backend
        run: pip install -e ".[dev]" && python -m pytest -q
      - name: Dependency audit (Python)
        working-directory: backend
        continue-on-error: true
        run: pip install pip-audit && pip-audit --skip-editable
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
      - name: E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npx playwright test --trace off
