[project]
name = "clippr"
version = "0.2.0"
description = "Vyral local backend: monitoring, clip pipeline, API, database and job runner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "httpx>=0.27",
  "keyring>=25",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "imageio-ffmpeg>=0.6",
  "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
clippr-backend = "clippr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clippr*"]

[tool.setuptools.package-data]
clippr = ["migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
